<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Cypherstudios - Manipular DOM</title>
    <meta name="description" content="Cypherstudios - Manipular DOM" />
    <meta name="author" content="Cypherstudios" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- noindex, nofollow, evita la indexación en buscadores -->

    <meta name="theme-color" content="#0E0E11" />
    <link rel="shortcut icon" href="./img/favicon.svg" type="image/x-icon" />
   
    <link rel="stylesheet" href="./css/formateo.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>tarjeta-persona</h1>
    </header>
    <main id="main">
      <article id="empleados" class="container">
        <section class="empleado card container-content">
          <header class="empleado-info">
            <h2>Empleado 1</h2>
          </header>
          <div class="empleado-info item" role="group">
            <h3>Profesion</h3>
            <p>empleado 1</p>
          </div>
          <div class="empleado-info item" role="group">
            <h3>Correo Electronico</h3>
            <p>empleado 1</p>
          </div>
          <div class="empleado-info item" role="group">
            <h3>Telefono</h3>
            <p>empleado 1</p>
          </div>
          <div class="empleado-info item" role="group">
            <h3>Ubicacion</h3>
            <p>empleado 1</p>
          </div>
        </section>

      </article>
    </main>
    <aside class="form-add">
      <header>
        <h3>Agregar Empleado</h3>
      </header>
      <form role="form" id="form-add" action="/" method="post">
        <div role="group" class="form-item">
          <label for="name-id">Nombre</label>
          <input type="text" name="name" id="name-id" />
        </div>
        <div role="group" class="form-item">
          <label for="profesion-id">Profesión</label>
          <input type="text" name="profesion" id="profesion-id" />
        </div>
        <div role="group" class="form-item">
          <label for="email-id">Correo electrónico</label>
          <input type="email" name="email" id="email-id" />
        </div>
        <div role="group" class="form-item">
          <label for="telefono-id">Teléfono</label>
          <input type="tel" name="telefono" id="telefono-id" />
        </div>
        <div role="group" class="form-item">
          <label for="ubicacion-id">Ubicación</label>
          <input type="text" name="ubicacion" id="ubicacion-id" />
        </div>
        <div role="group" class="send-form">
          <div role="group" class="form-item rgpd">
            <input type="checkbox" name="rgpd" id="rgpd_id" />
            <label for="rgpd_id">Acepto los terminos y condiciones de la RGPD</label>
          </div>
        <button type="submit" id="add-empleado">Agregar</button>
        </div>
    </aside>
    <script src="./js/tarjeta-persona.js"></script>
  </body>
</html>
