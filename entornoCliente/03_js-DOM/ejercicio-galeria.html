<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/style-galeria.css">
</head>

<body>
    <article class="container">
        <header class="header">
            <h1>css flexbox dinamic photo gallery</h1>
        </header>
        <section class="section-article">
            <div class="flexbox formulario" role="form">
                <header>
                    <h3>Añadir imagen</h3>
                </header>
                <form action="/">
                    <div role="group">
                        <label for="link-img-id"></label>
                        <input type="url" name="link-img" id="link-img-id">
                    </div>
                    <div role="group">
                        <label for="caption-id"></label>
                        <input type="text" name="caption" id="caption-id">
                    </div>
                    <input type="button" value="Enviar">
                </form>
            </div>
            <div id="gallery" role="group" class="flexbox gallery">
                <figure class="gallery-item">
                    <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/1.jpg"
                        alt="Imagen 1 de la galer a" title="Imagen 1 de la galer a" loading="lazy" />
                    <figcaption>
                        <h3>Imagen 1 de la galer a</h3>
                    </figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="https://cdn.freecodecamp.org/curriculum/css-photo-gallery/2.jpg"
                        alt="Imagen 2 de la galer a" title="Imagen 2 de la galer a" loading="lazy" />

                        <h3>Imagen 2 de la galer a</h3>
                    </figcaption>

                        <h3>Imagen 3 de la galer a</h3>

                        <h3>Imagen 4 de la galer a</h3>
