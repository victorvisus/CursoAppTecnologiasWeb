<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>



    <img src="" alt="" loading="lazy">

    <div contenteditable="true" style="width: 100px; height: 100px; border: 1px solid black;"></div>

    <div class="item">
        <button>Boton 1</button>
    </div>
    <div class="item">
        <button>Boton 2</button>
    </div>
    <div class="item">
        <button>Boton 3</button>
    </div>

    <script>
        document.querySelectorAll('.item').forEach(el => el.addEventListener('click', fn))

        document.createElement('div');

        function fn(e) {
            console.log(e.target);
        }

        async function sinRetorno() {
            console.log("Hola, estoy haciendo algo...");
            // No hay return
        }
        const resultado = sinRetorno();
        console.log(resultado);
        // Verás: Promise { <state>: "fulfilled", <value>: undefined }

        for (let i = 0; i < 3; i++) {
            if (i === 1) {
                continue; // Salta el número 1
            }
            console.log(i);
        }


        document.getElementById('btn').addEventListener('click', function () {
            const items = document.getElementsByClassName('item');

            // Convertir HTMLCollection a array para poder usar forEach
            Array.from(items).forEach(el => el.style.color = 'red');

        })
    </script>
</body>

</html>
