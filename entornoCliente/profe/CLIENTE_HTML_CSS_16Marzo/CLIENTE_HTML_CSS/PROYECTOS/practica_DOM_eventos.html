        // Eventos de teclado:
        const miInput = document.getElementById("campo-prueba");

        miInput.addEventListener('keydown', function (e) {

            console.log('Tecla liberada: ' + e.key);
        });

        miInput.addEventListener('keydown', function (e) {
            console.log('Tecla: ' + e.key); // 'a', 'Enter', 'Escape'
            console.log('Código-obsoleto: ' + e.keyCode);// Número de la tecla (obsoleto)
